version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Playwright is pinned on purpose: package.json, the Docker image and
    # expected.json are bumped together, by hand.
    ignore:
      - dependency-name: "playwright"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "mcr.microsoft.com/playwright"
